<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Funil — Seca Ayuno</title>
<style>
  :root{ --theme:#14b8a6; --ink:#0f172a; --mut:#64748b; --line:#e2e8f0; --bad:#ef4444; }
  *{box-sizing:border-box}
  body{margin:0;background:#f1f5f9;color:var(--ink);font:15px/1.5 -apple-system,Segoe UI,Roboto,Inter,sans-serif}
  .wrap{max-width:820px;margin:0 auto;padding:28px 18px 60px}
  h1{font-size:1.4rem;margin:0 0 4px}
  .sub{color:var(--mut);margin:0 0 18px;font-size:.9rem}
  .bar-controls{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .bar-controls button{border:1px solid var(--line);background:#fff;padding:7px 14px;border-radius:999px;cursor:pointer;font:inherit}
  .bar-controls button.on{background:var(--theme);color:#fff;border-color:var(--theme)}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:22px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .card .n{font-size:1.5rem;font-weight:800}
  .card .k{color:var(--mut);font-size:.8rem}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th,td{padding:10px 12px;text-align:left;font-size:.88rem;border-bottom:1px solid var(--line)}
  th{background:#f8fafc;color:var(--mut);font-weight:600}
  tr:last-child td{border-bottom:0}
  .plabel{color:var(--mut);font-size:.82rem;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .barcell{position:relative;min-width:120px}
  .barcell > i{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--theme) 16%,#fff);border-right:2px solid var(--theme);z-index:0}
  .barcell > span{position:relative;z-index:1;font-weight:700}
  .drop{font-weight:700}
  .drop.hi{color:var(--bad)}
  .muted{color:var(--mut)}
  .err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;padding:14px;border-radius:12px}
  .err code{display:block;margin-top:8px;font-size:.78rem;white-space:pre-wrap;word-break:break-word}
  .foot{margin-top:16px;color:var(--mut);font-size:.8rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>Funil do quiz — leads por página</h1>
  <p class="sub">Pessoas únicas que viram cada página (páginas de homem e mulher somadas). Atualiza a cada ~1 min.</p>

  <div class="bar-controls" id="range">
    <button data-d="1">Hoje</button>
    <button data-d="7" class="on">7 dias</button>
    <button data-d="30">30 dias</button>
    <button data-d="90">90 dias</button>
  </div>

  <div id="out"><p class="muted">Cargando…</p></div>
  <p class="foot" id="foot"></p>
</div>

<script>
const params = new URLSearchParams(location.search);
const k = params.get('k');
let days = 7, labels = {};

// build page labels from the live quiz.json
fetch('/quiz.json').then(r=>r.json()).then(q=>{
  (q.steps||[]).forEach(s=>{
    const m = /^p(\d+)/.exec(s.title||'');
    if(!m) return;
    const p = +m[1];
    if (labels[p]) return;
    for(const l of (s.layers||[])){
      const c = l.content||{};
      const t = String(c.text||c.introduction||'').replace(/<[^>]+>/g,' ').replace(/&nbsp;| /g,' ').replace(/\s+/g,' ').trim();
      if(t){ labels[p] = t.slice(0,80); break; }
    }
  });
}).finally(load);

document.getElementById('range').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  days = +b.dataset.d;
  [...e.currentTarget.children].forEach(x=>x.classList.toggle('on', x===b));
  load();
});

function fmtPct(x){ return (x>=0?'':'') + x.toFixed(1) + '%'; }

async function load(){
  const out = document.getElementById('out');
  out.innerHTML = '<p class="muted">Cargando…</p>';
  try{
    const url = '/api/funnel?days=' + days + (k ? '&k=' + encodeURIComponent(k) : '');
    const res = await fetch(url);
    const data = await res.json();
    if(!res.ok) throw new Error(data.error ? (typeof data.error==='string'?data.error:JSON.stringify(data.error)) : ('HTTP '+res.status));
    render(data);
  }catch(err){
    out.innerHTML = '<div class="err"><b>No se pudo cargar.</b><code>'+String(err.message||err)+'</code>'
      + '<div style="margin-top:8px">Verifica que <b>POSTHOG_API_KEY</b> esté configurada en Vercel (Settings → Environment Variables) y que sea una Personal API Key con permiso <b>Query Read</b>.</div></div>';
  }
}

function render(data){
  const rows = (data.rows||[]).slice().sort((a,b)=>a.page-b.page);
  const out = document.getElementById('out');
  if(!rows.length){ out.innerHTML = '<p class="muted">Sin datos todavía en este período. Entra al quiz para generar eventos.</p>'; return; }

  const start = rows[0].people || 1;
  const max = rows[0].people || 1;
  const t = data.totals || {};

  let cards = '<div class="cards">'
    + card('Iniciaron', t.quiz_started ?? rows[0].people)
    + card('Página 0', pageCount(rows,0))
    + card('Completaron', t.quiz_completed ?? '—')
    + card('Click checkout', t.checkout_click ?? '—')
    + '</div>';

  let html = cards + '<table><tr><th>Página</th><th>Pessoas</th><th>% do início</th><th>Perda vs. anterior</th></tr>';
  let prev = null;
  for(const r of rows){
    const pctStart = r.people/start*100;
    const dropPrev = prev==null ? null : (prev.people ? (prev.people - r.people)/prev.people*100 : 0);
    const w = Math.max(2, r.people/max*100);
    html += '<tr>'
      + '<td><b>P'+r.page+'</b><div class="plabel">'+(labels[r.page]||'')+'</div></td>'
      + '<td class="barcell"><i style="width:'+w+'%"></i><span>'+r.people.toLocaleString('es')+'</span></td>'
      + '<td>'+pctStart.toFixed(1)+'%</td>'
      + '<td>'+(dropPrev==null ? '<span class="muted">—</span>'
              : '<span class="drop'+(dropPrev>=25?' hi':'')+'">-'+dropPrev.toFixed(1)+'%</span>')+'</td>'
      + '</tr>';
    prev = r;
  }
  html += '</table>';
  out.innerHTML = html;
  document.getElementById('foot').textContent = 'Período: últimos ' + data.days + ' días · ' + new Date().toLocaleString('es');
}

function pageCount(rows,p){ const r = rows.find(x=>x.page===p); return r?r.people:'—'; }
function card(k,n){ return '<div class="card"><div class="n">'+(typeof n==='number'?n.toLocaleString('es'):n)+'</div><div class="k">'+k+'</div></div>'; }
</script>
</body>
</html>
