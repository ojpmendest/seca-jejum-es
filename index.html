<style>
  :root{
    --theme:#14b8a6; --title:#030712; --content:#71717a; --bg:#ffffff;
    --radius:1rem; --el:56px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#e9eef4;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--title);font-size:16px}
  #app{max-width:460px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;overflow-x:hidden}
  header{position:sticky;top:0;background:var(--bg);padding:12px 20px 8px;z-index:5}
  header .bar{height:6px;border-radius:999px;background:#eceef1;overflow:hidden}
  header .bar > i{display:block;height:100%;background:var(--theme);width:0;transition:width .35s ease}
  header .logo{display:block;height:28px;margin:0 auto 8px}
  .back{position:absolute;left:16px;top:12px;border:0;background:none;font-size:20px;color:#9aa0a6;cursor:pointer;line-height:1}
  main{flex:1;min-width:0;padding:14px 20px 28px;display:flex;flex-direction:column;justify-content:safe center}
  main > .stack{width:100%;min-width:0;animation:fade .34s cubic-bezier(.22,.61,.36,1) both;will-change:opacity,transform}
  @media (prefers-reduced-motion:reduce){main > .stack{animation:none}}
  @keyframes fade{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
  h1,h2,h3{line-height:1.3;margin:.4em 0}
  h1{font-size:1.6rem;font-weight:800}h2{font-size:1.5rem;font-weight:700}h3{font-size:1.15rem;font-weight:600}
  p{color:var(--content);line-height:1.5;margin:.5em 0;font-size:1rem}
  .ql-align-center{text-align:center}
  img{max-width:100%;height:auto;display:block}
  .stack > * + *{margin-top:12px}
  .row{display:flex;gap:10px;align-items:flex-start;justify-content:center}
  .row .opts{gap:8px}
  .conv{font-size:.72rem;color:var(--content);text-align:center;margin-top:8px;line-height:1.4}
  .scarcity{display:flex;gap:6px;align-items:center;justify-content:center;text-align:center;
    margin-top:10px;font-size:.82rem;font-weight:600;color:#b91c1c;line-height:1.35}
  #backwarn{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:9999;padding:24px}
  #backwarn[hidden]{display:none}
  #backwarn .bw-card{background:#fff;border-radius:16px;padding:24px 22px;max-width:360px;text-align:center}
  #backwarn .bw-title{font-size:1.15rem;font-weight:800;margin-bottom:8px;color:#b91c1c}
  #backwarn p{color:var(--title);font-size:.95rem;margin:0 0 16px}
  #app.intro main{padding-top:4px}
  #app.intro h1{font-size:1.3rem}
  #app.intro h2{font-size:1.3rem;line-height:1.22}
  #app.intro h3{font-size:1rem}
  #app.intro .stack > * + *{margin-top:8px}
  #app.intro .spacer{height:2px}
  #app.intro .imgwrap img{width:auto;max-width:100%;max-height:32vh}
  #app.intro .scarcity{margin-top:8px}
  @media (max-height:740px){
    #app.intro h1,#app.intro h2{font-size:1.12rem;line-height:1.2}
    #app.intro h3{font-size:.85rem;line-height:1.3}
    #app.intro .imgwrap img{max-height:24vh}
    #app.intro header{padding:6px 20px 4px}
    #app.intro .logo{height:22px;margin-bottom:4px}
    #app.intro .scarcity{font-size:.75rem;margin-top:6px}
  }
  .spacer{height:16px}
  .imgwrap{display:flex;justify-content:center}
  .imgwrap img{border-radius:var(--radius);width:100%;height:auto}
  button.cta{width:100%;min-height:var(--el);border:0;border-radius:var(--radius);background:var(--theme);color:#fff;
    font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;padding:12px 18px;box-shadow:0 8px 20px -8px var(--theme)}
  button.cta:active{transform:translateY(1px)}
  button.cta.pulse{animation:ctaPulse 1.6s ease-in-out infinite}
  @keyframes ctaPulse{
    0%,100%{transform:scale(1);box-shadow:0 8px 20px -8px var(--theme)}
    50%{transform:scale(1.035);box-shadow:0 12px 30px -6px var(--theme)}
  }
  @media (prefers-reduced-motion:reduce){button.cta.pulse{animation:none}}
  .opts{display:grid;gap:10px}
  .opts.grid2{grid-template-columns:1fr 1fr}
  .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid #e6e8eb;background:#fff;
    border-radius:var(--radius);padding:12px 14px;font:inherit;font-size:.98rem;color:var(--title);cursor:pointer;min-height:var(--el)}
  @media (hover:hover){ .opt:hover{border-color:var(--theme)} }
  .opt:focus{outline:none}
  .opt.sel{border-color:var(--theme);background:color-mix(in srgb,var(--theme) 8%,#fff)}
  .opt.sel.chkstyle{background:var(--theme)}
  .opt.sel.chkstyle *{color:#fff!important}
  .opt .chk{flex:none;width:24px;height:24px;border:2px solid #cfd4da;border-radius:6px;position:relative;background:#fff}
  .opt.sel .chk{border-color:#fff}
  .opt.sel .chk::after{content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid var(--theme);border-width:0 2px 2px 0;transform:rotate(45deg)}
  .opt.col .chk{position:absolute;top:8px;right:8px}
  .opt img{width:52px;height:52px;object-fit:contain;border-radius:10px;flex:none}
  .opt .emoji{font-size:28px;line-height:1;flex:none}
  .opt:not(.col) > div{flex:1}
  .opt.rev{flex-direction:row-reverse}
  .opt > .chev{margin-left:auto;color:var(--content);font-size:1.25rem;line-height:1}
  .opt p{margin:0;color:inherit}
  .opt.col{flex-direction:column;text-align:left;padding:0;gap:0;overflow:hidden;align-items:stretch}
  .opt.col img{width:100%;aspect-ratio:1/1;height:auto;object-fit:cover;border-radius:0}
  .opt.col .lbl{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px}
  .opt.col .lbl p{flex:1}
  .opt.col .chev{color:var(--content);font-size:1.25rem;line-height:1}
  .field input{width:100%;min-height:var(--el);border:1.5px solid #e6e8eb;border-radius:var(--radius);
    padding:10px 16px;font:inherit;font-size:1.05rem;text-align:center}
  .field input:focus{outline:0;border-color:var(--theme)}
  .ruler-wrap{text-align:center;width:100%;min-width:0}
  .ruler-box,.ruler{width:100%;min-width:0}
  .unit-toggle{display:inline-flex;background:#eef0f2;border-radius:999px;padding:4px;gap:2px;margin-bottom:20px}
  .useg{border:0;background:none;font:inherit;font-weight:600;color:var(--content);padding:8px 24px;border-radius:999px;cursor:pointer}
  .useg.on{background:var(--theme);color:#fff}
  .ruler-val{font-size:2.6rem;font-weight:800;color:var(--title);line-height:1;margin-bottom:10px}
  .ruler-val span{font-size:1rem;font-weight:700;margin-left:3px}
  .ruler-box{position:relative}
  .ruler{position:relative;overflow-x:scroll;overflow-y:hidden;height:76px;scrollbar-width:none;-webkit-overflow-scrolling:touch;border-bottom:1px solid #e6e8eb;cursor:grab;user-select:none;-webkit-user-select:none}
  .ruler.grabbing{cursor:grabbing}
  .ruler::-webkit-scrollbar{display:none}
  .ruler-track{display:flex;align-items:flex-start;height:100%;width:max-content}
  .rsp{flex:none}
  .tick{position:relative;height:13px;flex:none}
  .tick::before{content:"";position:absolute;left:0;top:0;width:1px;height:100%;background:#cbd0d6}
  .tick.mid{height:19px}
  .tick.maj{height:30px}
  .tick.maj::before{background:#9aa0a6}
  .tlab{position:absolute;top:34px;left:0;transform:translateX(-50%);font-size:.82rem;color:var(--content);white-space:nowrap}
  .ruler-mark{position:absolute;left:50%;top:0;width:3px;height:42px;background:var(--theme);transform:translateX(-50%);z-index:2;pointer-events:none}
  .ruler-mark::after{content:"";position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);border:7px solid transparent;border-top-color:var(--theme)}
  .ruler-hint{font-size:.82rem;color:var(--content);margin:10px 0 20px}
  .metric{margin:14px 0}
  .metric-head{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;font-size:.92rem;color:var(--title)}
  .metric-head .pct{font-weight:800}
  .metric-sub{color:var(--content);font-size:.85rem;margin:2px 0 8px}
  .metric .track{position:relative;height:12px;border-radius:999px;
    background:linear-gradient(90deg,#22c55e,#fbbf24 50%,#dc2626)}
  .metric .track.solid{background:#e6e8eb}
  .metric .track > b{position:absolute;top:50%;width:20px;height:20px;border-radius:50%;background:#fff;
    border:3px solid var(--theme);transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.2)}
  .metric .track > u{position:absolute;top:50%;height:12px;border-radius:999px;background:var(--theme);transform:translateY(-50%);left:0}
  .legends{display:flex;justify-content:space-between;color:var(--content);font-size:.78rem;margin-top:6px}
  .arg-card{border:1px solid #e6e8eb;border-radius:var(--radius);padding:16px 16px 14px;text-align:center}
  .arg-emoji{font-size:34px;line-height:1;margin-bottom:4px}
  .arg-img{display:flex;justify-content:center;margin-bottom:6px}
  .arg-img img{width:46px;height:46px;object-fit:contain}
  .arg-card h1,.arg-card h2,.arg-card h3{font-size:1.05rem;margin:.15em 0}
  .arg-card p{font-size:.9rem;margin:.35em 0 0;line-height:1.45}
  .sub{font-weight:600;margin-top:8px}
  .alert{border-radius:var(--radius);padding:14px 16px;font-size:.95rem}
  .alert.info{background:#eff6ff;color:#1e3a8a}
  .alert.warning{background:#fef3c7;color:#92400e}
  .alert.success{background:#ecfdf5;color:#065f46}
  .alert p{color:inherit;margin:.3em 0}
  .carousel{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
  .carousel > div{flex:0 0 78%;scroll-snap-align:center}
  .carousel img{border-radius:var(--radius)}
  .price{border:2px solid var(--theme);border-radius:var(--radius);overflow:hidden;text-align:left}
  .price .feat{background:var(--theme);color:#fff;font-weight:700;font-size:.9rem;padding:9px 12px;text-align:center}
  .price .pbody{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px}
  .price .ptitle{flex:1;font-weight:800;font-size:1.02rem;line-height:1.25}
  .price .ptitle p{margin:0;font:inherit}
  .price .pcol{flex:none;text-align:right}
  .price .big{font-size:1.75rem;font-weight:800;color:var(--theme);line-height:1}
  .price .before{color:var(--content);font-size:.8rem}
  .price .after{color:var(--content);font-size:.78rem;margin-top:3px}
  .price .conv{padding:0 16px 12px}
  svg.chart{width:100%;height:auto;overflow:visible;display:block}
  .loading{text-align:center;padding:24px 0}
  .ring{width:96px;height:96px;margin:0 auto 14px}
  .note{font-size:.75rem;color:#b6bcc3;text-align:center;padding:10px}
</style>

<body>
<div id="app">
  <header>
    <button class="back" id="back" title="Volver">‹</button>
    <img class="logo" id="logo" alt="">
    <div class="bar"><i id="prog"></i></div>
  </header>
  <main id="main"></main>
</div>
<div id="backwarn" hidden>
  <div class="bw-card">
    <div class="bw-title">⚠️ ¿Vas a rendirte otra vez?</div>
    <p>Si sales ahora, pierdes la oportunidad de por fin adelgazar sin dietas imposibles ni pasar hambre. Al salir, esta página se bloquea — y no vas a poder volver a abrirla.</p>
    <button class="cta" id="bw-ok">Seguir con el test</button>
  </div>
</div>
<script>
const S = {};
let quiz, stepIndex = 0, history = [], selected = new Set();

fetch('quiz.json').then(r => r.json()).then(q => {
  quiz = q;
  const jump = parseInt(new URLSearchParams(location.search).get('step'), 10);
  if (!isNaN(jump) && jump >= 0 && jump < q.steps.length) stepIndex = jump;
  const d = q.design || {};
  const rs = document.documentElement.style;
  if (d.themeColor) rs.setProperty('--theme', d.themeColor);
  if (d.titleColor) rs.setProperty('--title', d.titleColor);
  if (d.contentColor) rs.setProperty('--content', d.contentColor);
  if (d.backgroundColor) rs.setProperty('--bg', d.backgroundColor);
  if (d.elementSize) rs.setProperty('--el', d.elementSize);
  if (d.logo && d.logo.src) document.getElementById('logo').src = d.logo.src;
  render();
});

// back-button trap: keep the visitor on the quiz + show a warning
var trapArmed = false;
(function backTrap(){
  setTimeout(function(){ trapArmed = true; }, 1000);
  var cooldownUntil = 0;
  window.history.pushState(null, '', location.href);
  window.addEventListener('popstate', function(){
    window.history.pushState(null, '', location.href);
    if (!trapArmed || Date.now() < cooldownUntil) return;
    var bw = document.getElementById('backwarn');
    if (bw) bw.hidden = false;
  });
  var ok = document.getElementById('bw-ok');
  if (ok) ok.onclick = function(){
    document.getElementById('backwarn').hidden = true;
    cooldownUntil = Date.now() + 500;
  };
})();

document.getElementById('back').onclick = () => {
  if (history.length) { stepIndex = history.pop(); render(true); }
};

function idxById(id){ return quiz.steps.findIndex(s => s.id === id); }

function goto(dest){
  trapArmed = true;
  history.push(stepIndex);
  if (!dest || dest === 'next') stepIndex = Math.min(stepIndex + 1, quiz.steps.length - 1);
  else { const i = idxById(dest); stepIndex = i >= 0 ? i : Math.min(stepIndex + 1, quiz.steps.length - 1); }
  selected = new Set();
  render();
}

function fillVars(html){
  return String(html || '')
    .replace(/<span[^>]*>(?:\s|&nbsp;| |﻿)*<\/span>/gi, '')
    .replace(/﻿/g, '')
    .replace(/\{\{\s*([\w-]+)\s*\}\}/g, (m, k) => (S[k] != null && S[k] !== '') ? S[k] : (/peso/i.test(k) ? '68' : m));
}

function render(isBack){
  const step = quiz.steps[stepIndex];
  document.getElementById('prog').style.width = Math.round((stepIndex+1)/quiz.steps.length*100) + '%';
  document.getElementById('back').style.visibility = history.length ? 'visible' : 'hidden';
  document.getElementById('app').classList.toggle('intro', stepIndex === 0);
  window.scrollTo(0, 0);
  const m = document.getElementById('main');
  m.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'stack';
  // group consecutive layers with basis < 100 into side-by-side rows
  let row = null, rowSum = 0;
  const flush = () => { if (row){ wrap.appendChild(row); row = null; rowSum = 0; } };
  (step.layers || []).forEach(l => {
    const el = renderLayer(l, step);
    if (!el) return;
    const d = l.design;
    const b = (d && !Array.isArray(d) && d.basis != null) ? parseFloat(d.basis) : 100;
    if (b >= 100 || isNaN(b)) { flush(); wrap.appendChild(el); return; }
    if (row && rowSum + b > 101) flush();
    if (!row){ row = document.createElement('div'); row.className = 'row'; }
    el.style.flex = '0 1 ' + b + '%';
    el.style.minWidth = '0';
    row.appendChild(el);
    rowSum += b;
  });
  flush();
  // auto-advance for loading-only steps handled in renderLayer
  m.appendChild(wrap);
}

function h(tag, cls, html){ const e = document.createElement(tag); if(cls) e.className = cls; if(html!=null) e.innerHTML = html; return e; }

function stepNextButton(step){
  // find a button layer on this step to use as the "continue" target
  const b = (step.layers||[]).find(l => l.type === 'button');
  return b ? (b.content.destination || 'next') : 'next';
}

function rulerControl(l, step){
  const c = l.content || {};
  const isH = l.type === 'height';
  const base = isH ? 'cm' : 'kg';
  const units = isH
    ? [{ k: 'cm', min: 120, max: 220, px: 8 }, { k: 'pulg', min: 47, max: 87, px: 20 }]
    : [{ k: 'kg', min: 40, max: 160, px: 8 }, { k: 'lb', min: 90, max: 350, px: 4 }];
  const conv = (v, from, to) => from === to ? v
    : isH ? (from === 'cm' ? v / 2.54 : v * 2.54)
          : (from === 'kg' ? v * 2.20462 : v / 2.20462);
  let ui = 0;
  let val = parseFloat(c.value) || (isH ? 170 : 70);

  const box = h('div', 'ruler-wrap stack');

  const toggle = h('div', 'unit-toggle');
  units.forEach((u, i) => {
    const seg = h('button', 'useg' + (i === 0 ? ' on' : ''), u.k);
    seg.onclick = () => {
      if (i === ui) return;
      val = conv(val, units[ui].k, u.k);
      ui = i;
      [...toggle.children].forEach((x, j) => x.classList.toggle('on', j === i));
      build();
    };
    toggle.appendChild(seg);
  });
  box.appendChild(toggle);

  const bigv = h('div', 'ruler-val');
  box.appendChild(bigv);

  const rbox = h('div', 'ruler-box');
  const ruler = h('div', 'ruler');
  const mark = h('div', 'ruler-mark');
  rbox.appendChild(ruler); rbox.appendChild(mark);

  // mouse drag (desktop) — touch uses native scroll
  let drag = null;
  ruler.addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch') return;
    drag = { x: e.clientX, s: ruler.scrollLeft };
    ruler.classList.add('grabbing');
    ruler.setPointerCapture(e.pointerId);
  });
  ruler.addEventListener('pointermove', e => {
    if (!drag) return;
    ruler.scrollLeft = drag.s - (e.clientX - drag.x);
  });
  const endDrag = () => { drag = null; ruler.classList.remove('grabbing'); };
  ruler.addEventListener('pointerup', endDrag);
  ruler.addEventListener('pointercancel', endDrag);
  ruler.addEventListener('wheel', e => { ruler.scrollLeft += e.deltaY + e.deltaX; e.preventDefault(); }, { passive: false });
  box.appendChild(rbox);
  box.appendChild(h('div', 'ruler-hint', 'Arrastra para ajustar'));
  // no button here — the step's own button layer advances; we just keep S updated live
  if ((step.layers || []).every(x => x.type !== 'button')) {
    const cont = h('button', 'cta', 'Continuar');
    cont.onclick = () => goto(stepNextButton(step));
    box.appendChild(cont);
  }

  const setBig = () => {
    bigv.innerHTML = '<b>' + Math.round(val) + '</b><span>' + units[ui].k + '</span>';
    if (c.name) S[c.name] = Math.round(conv(val, units[ui].k, base));
  };

  let snapT, ticks = [];
  function centerFor(i) {
    const t = ticks[i];
    return t.offsetLeft + t.offsetWidth / 2 - ruler.clientWidth / 2;
  }
  function nearestIndex() {
    const c = ruler.scrollLeft + ruler.clientWidth / 2;
    let best = 0, bd = Infinity;
    for (let i = 0; i < ticks.length; i++) {
      const d = Math.abs(ticks[i].offsetLeft + ticks[i].offsetWidth / 2 - c);
      if (d < bd) { bd = d; best = i; }
    }
    return best;
  }
  function build() {
    const u = units[ui];
    ruler.innerHTML = '';
    const track = h('div', 'ruler-track');
    const half = h('div', 'rsp'); half.style.width = '50%';
    track.appendChild(half);
    ticks = [];
    for (let n = u.min; n <= u.max; n++) {
      const t = h('div', 'tick' + (n % 10 === 0 ? ' maj' : (n % 5 === 0 ? ' mid' : '')));
      t.style.width = u.px + 'px';
      if (n % 10 === 0) t.appendChild(h('span', 'tlab', String(n)));
      track.appendChild(t);
      ticks.push(t);
    }
    const half2 = h('div', 'rsp'); half2.style.width = '50%';
    track.appendChild(half2);
    ruler.appendChild(track);
    let lock = true;
    requestAnimationFrame(() => {
      val = Math.max(u.min, Math.min(u.max, Math.round(val)));
      ruler.scrollLeft = centerFor(val - u.min);
      setBig();
      setTimeout(() => { lock = false; }, 60);
    });
    ruler.onscroll = () => {
      if (lock) return;
      const u2 = units[ui];
      val = u2.min + nearestIndex();
      setBig();
      clearTimeout(snapT);
      snapT = setTimeout(() => {
        lock = true;
        ruler.scrollTo({ left: centerFor(nearestIndex()) });
        setTimeout(() => { lock = false; }, 60);
      }, 130);
    };
  }
  build();
  return box;
}

function renderLayer(l, step){
  const c = l.content || {};
  switch(l.type){
    case 'text':
      return h('div','', fillVars(c.text));
    case 'clear':
      return h('div','spacer');
    case 'image': {
      if(!c.image || !c.image.src) return null;
      const w = h('div','imgwrap'); const im = h('img'); im.src = c.image.src; im.alt=''; w.appendChild(im); return w;
    }
    case 'alert': {
      const style = (l.design && l.design.style) || 'info';
      return h('div','alert '+style, fillVars(c.text));
    }
    case 'arguments': {
      const box = h('div','stack');
      (c.arguments||[]).forEach(a => {
        const card = h('div','arg-card');
        if (a.image && a.image.src){
          if (a.image.type === 'emoji') card.appendChild(h('div','arg-emoji', a.image.src));
          else { const w = h('div','arg-img'); const im = h('img'); im.src = a.image.src; im.alt=''; w.appendChild(im); card.appendChild(w); }
        }
        card.appendChild(h('div','', fillVars(a.text)));
        box.appendChild(card);
      });
      return box;
    }
    case 'button': {
      const b = h('button','cta' + ((l.design && l.design.pulse) ? ' pulse' : '')); b.textContent = c.label || 'Continuar';
      b.onclick = () => {
        if (c.type === 'redirect' && /^https?:/.test(c.destination || '')) { window.open(c.destination, '_blank'); return; }
        goto(c.destination);
      };
      const showScarcity = stepIndex === 0 || c.type === 'redirect';
      if (!showScarcity) return b;
      const box = h('div');
      box.appendChild(b);
      box.appendChild(h('div','scarcity', '🔒 Si cierras esta página, se bloquea y no vas a poder volver a entrar.'));
      return box;
    }
    case 'options': {
      const box = h('div','');
      if (c.introduction) box.appendChild(h('div','', fillVars(c.introduction)));
      const multi = !!c.multiple;
      const dz = l.design || {};
      const vertical = dz.orientation === 'vertical';
      const showCheck = dz.icon === 'select';
      const showChev = ['right','arrow','chevron'].includes(dz.icon) && (dz.iconPosition || 'end') === 'end';
      const grid = h('div','opts' + (dz.grid === 'grid-cols-2' ? ' grid2' : ''));
      (c.options||[]).forEach(o => {
        const isEmoji = o.image && o.image.type === 'emoji' && o.image.src;
        const isImg = o.image && o.image.src && !isEmoji;
        const hasIcon = isImg || isEmoji;
        const btn = h('button','opt' + (vertical ? ' col' : (dz.order === 'reverse' && hasIcon ? ' rev' : '')) + (showCheck ? ' chkstyle' : ''));
        if (isImg){ const im = h('img'); im.src = o.image.src; im.alt=''; btn.appendChild(im); }
        else if (isEmoji){ btn.appendChild(h('span','emoji', o.image.src)); }
        if (vertical){
          const lbl = h('div','lbl');
          lbl.appendChild(h('div','', fillVars(o.label)));
          if (showChev) lbl.appendChild(h('span','chev','›'));
          if (showCheck) lbl.appendChild(h('span','chk'));
          btn.appendChild(lbl);
        } else {
          btn.appendChild(h('div','', fillVars(o.label)));
          if (showChev) btn.appendChild(h('span','chev','›'));
          if (showCheck) btn.appendChild(h('span','chk'));
        }
        btn.onclick = () => {
          if (multi){
            btn.classList.toggle('sel');
            o._sel = !o._sel;
          } else {
            goto(o.destination);
          }
        };
        grid.appendChild(btn);
      });
      box.appendChild(grid);
      const hasBtnLayer = (step.layers || []).some(l => l.type === 'button');
      if (multi && !hasBtnLayer){
        const cont = h('button','cta'); cont.textContent = 'Continuar'; cont.style.marginTop = '14px';
        cont.onclick = () => {
          const picked = (c.options||[]).find(o => o._sel && o.destination && o.destination !== 'next');
          goto(picked ? picked.destination : stepNextButton(step));
        };
        box.appendChild(cont);
      }
      return box;
    }
    case 'height': case 'weight':
      return rulerControl(l, step);
    case 'field': {
      const box = h('div','field stack');
      const inp = h('input'); inp.type = c.type === 'number' ? 'number' : 'text';
      inp.placeholder = c.placeholder || '';
      if (c.value) inp.value = c.value;
      inp.oninput = () => { if (c.name) S[c.name] = inp.value; };
      box.appendChild(inp);
      if ((step.layers || []).every(x => x.type !== 'button')) {
        const b = h('button','cta'); b.textContent = 'Continuar';
        b.onclick = () => { if (c.name) S[c.name] = inp.value; goto(stepNextButton(step)); };
        box.appendChild(b);
      }
      return box;
    }
    case 'metric': {
      const box = h('div','metric');
      const color = (l.design && l.design.color) || '';
      const isSolid = /bg-(red|green)/.test(color);
      const pct = Math.max(0, Math.min(100, parseFloat(c.percent||'50')));
      if (c.show_title !== false && c.title){
        const head = h('div','metric-head');
        head.appendChild(h('span','', c.title));
        if (c.show_percent !== false && c.percent && !isSolid) head.appendChild(h('span','pct', c.percent + '%'));
        box.appendChild(head);
      }
      if (c.subtitle && !isSolid) box.appendChild(h('div','metric-sub', c.subtitle));
      const track = h('div','track' + (isSolid ? ' solid' : ''));
      if (isSolid){
        const u = h('u'); u.style.width = pct+'%';
        u.style.background = color.includes('red') ? '#ef4444' : '#22c55e';
        track.appendChild(u);
      }
      if (c.show_dot !== false){ const b = h('b'); b.style.left = pct+'%'; track.appendChild(b); }
      box.appendChild(track);
      if (c.legends){
        const lg = h('div','legends');
        c.legends.split(',').forEach(t => lg.appendChild(h('span','', t.trim())));
        box.appendChild(lg);
      }
      if (c.subtitle && isSolid) box.appendChild(h('div','sub', c.subtitle));
      return box;
    }
    case 'charts': {
      const ds = (c.datasets||[])[0];
      if (!ds || !ds.datas || !ds.datas.length) return null;
      const datas = ds.datas;
      const vals = datas.map(d => parseFloat(d.value)||0);
      const max = Math.max(...vals, 1), n = vals.length;
      const W = 340, H = 200, padX = 14, padT = 34, padB = 22;
      const x = i => padX + i * (W - 2*padX) / (n - 1);
      const y = v => padT + (1 - v/max) * (H - padT - padB);
      const pts = vals.map((v,i) => [x(i), y(v)]);
      const dLine = pts.map((p,i) => (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
      const area = dLine + ` L ${x(n-1).toFixed(1)} ${(H-padB).toFixed(1)} L ${x(0).toFixed(1)} ${(H-padB).toFixed(1)} Z`;
      const gridX = pts.map(p => `<line x1="${p[0].toFixed(1)}" y1="${padT}" x2="${p[0].toFixed(1)}" y2="${H-padB}" stroke="#e6e8eb" stroke-width="1" stroke-dasharray="3 3"/>`).join('');
      const rows = 4;
      const gridY = Array.from({length: rows+1}, (_,r) => {
        const yy = padT + r*(H-padT-padB)/rows;
        return `<line x1="${padX}" y1="${yy.toFixed(1)}" x2="${W-padX}" y2="${yy.toFixed(1)}" stroke="#e6e8eb" stroke-width="1" stroke-dasharray="3 3"/>`;
      }).join('');
      const lerpColor = t => {
        const c1=[0xdc,0x26,0x26], c2=[0xfb,0xbf,0x24], c3=[0x22,0xc5,0x5e];
        const [a,b,f] = t < .5 ? [c1,c2,t*2] : [c2,c3,(t-.5)*2];
        return 'rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*f)).join(',')+')';
      };
      const dots = pts.map((p,i) => {
        const d = datas[i];
        if (d.hiddenDot) return '';
        const col = lerpColor(i/(n-1));
        const big = d.featured || i === 0 || i === n-1;
        const halo = !big ? `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="9" fill="#cfd4da" opacity="0.5"/>` : '';
        return halo + `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${big?6:4}" fill="${col}" stroke="#fff" stroke-width="${big?2.5:1.5}"/>`;
      }).join('');
      const pills = datas.map((d,i) => {
        if (!d.tooltip) return '';
        const p = pts[i];
        const txt = fillVars(d.tooltip);
        const last = i === n-1;
        const w = txt.length * 8 + 16;
        const px = Math.max(2, Math.min(W - w - 2, p[0] - w/2));
        const py = last ? p[1] - 34 : p[1] - 30;
        const fill = last ? 'var(--theme)' : '#ffffff';
        const tcol = last ? '#ffffff' : '#111827';
        const bd = last ? 'none' : '#d1d5db';
        return `<g><rect x="${px.toFixed(1)}" y="${py.toFixed(1)}" width="${w}" height="24" rx="7" fill="${fill}" stroke="${bd}"/>`
          + `<text x="${(px+w/2).toFixed(1)}" y="${(py+16).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="700" fill="${tcol}">${txt}</text></g>`;
      }).join('');
      const xl = (c.xAxis||[]).map((t,i) => t
        ? `<text x="${x(i).toFixed(1)}" y="${H-4}" font-size="11" fill="#9aa0a6" text-anchor="${i===0?'start':(i===n-1?'end':'middle')}">${t}</text>` : '').join('');
      const svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
        <defs><linearGradient id="chg" x1="0" x2="1"><stop offset="0" stop-color="#dc2626"/><stop offset="50%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#22c55e"/></linearGradient></defs>
        ${gridY}${gridX}
        <path d="${area}" fill="url(#chg)" opacity="0.16"/>
        <path d="${dLine}" fill="none" stroke="url(#chg)" stroke-width="3.5" stroke-linejoin="round"/>
        ${dots}${pills}${xl}
      </svg>`;
      return h('div','', svg);
    }
    case 'carousel': {
      const box = h('div','carousel');
      (c.items||[]).forEach(it => {
        const card = h('div','');
        if (it.image && it.image.src){ const im = h('img'); im.src = it.image.src; im.alt=''; card.appendChild(im); }
        if (it.text) card.appendChild(h('div','', fillVars(it.text)));
        box.appendChild(card);
      });
      return box;
    }
    case 'price': {
      const box = h('div','price');
      if (c.featured) box.appendChild(h('div','feat', fillVars(c.featured)));
      const body = h('div','pbody');
      if (c.title) body.appendChild(h('div','ptitle', fillVars(c.title)));
      const col = h('div','pcol');
      if (c.before) col.appendChild(h('div','before', c.before));
      col.appendChild(h('div','big', c.value || ''));
      if (c.after) col.appendChild(h('div','after', c.after));
      body.appendChild(col);
      box.appendChild(body);
      box.appendChild(h('div','conv', 'El importe se cobra convertido automáticamente a la moneda de tu país.'));
      return box;
    }
    case 'loading': {
      const box = h('div','loading');
      const secs = c.seconds || 4;
      box.appendChild(h('div','ring', `<svg viewBox="0 0 36 36" width="96" height="96"><circle cx="18" cy="18" r="16" fill="none" stroke="#eceef1" stroke-width="3"/><circle id="ldc" cx="18" cy="18" r="16" fill="none" stroke="var(--theme)" stroke-width="3" stroke-dasharray="100" stroke-dashoffset="100" transform="rotate(-90 18 18)" stroke-linecap="round"/></svg>`));
      const pctEl = h('div','sub','0%');
      box.appendChild(pctEl);
      if (c.description) box.appendChild(h('div','', fillVars(c.description)));
      const t0 = Date.now();
      const iv = setInterval(() => {
        const p = Math.min(1, (Date.now()-t0)/(secs*1000));
        pctEl.textContent = Math.round(p*100) + '%';
        const circ = box.querySelector('#ldc'); if (circ) circ.setAttribute('stroke-dashoffset', String(100 - p*100));
        if (p >= 1){ clearInterval(iv); goto(c.destination); }
      }, 60);
      return box;
    }
    default:
      return null;
  }
}
</script>
</body>
</html>
